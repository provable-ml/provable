[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provable"
version = "0.12.0rc1"
description = "Exact audit, surgery, certified discovery, and the certificate layer for tree ensembles"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "statsmodels>=0.14", "xgboost>=2.0", "tabulate", "plotly", "qrcode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://provable.ml"
Documentation = "https://provable.ml"
Repository = "https://github.com/provable-ml/provable"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]
