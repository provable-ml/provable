[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provable-verify"
version = "0.9.0"
description = "Independent certificate checker for provable dossiers. Shares no code with provable; numpy and stdlib only."
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
